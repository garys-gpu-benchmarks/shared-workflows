# Lint configuration only (same rules as the generated workloads).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit rule set: pyflakes plus the syntax/import/statement pycodestyle
# checks. Pinned so CI does not change when ruff changes its defaults.
# Long lines (E501) are deliberately not enforced.
select = ["E4", "E7", "E9", "F"]
